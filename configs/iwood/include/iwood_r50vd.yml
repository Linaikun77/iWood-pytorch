      4: 8.6,  # Phoebe_bournei 8.6
      5: 5.0,  # Phoebe_chekiangensis 5.0
      6: 8.8,  # Phoebe_hungmaoensis 7.6 - 8.2 +
      7: 8.4,  # Phoebe_nanmu 8.4
      8: 8.6,  # Phoebe_neurantha 8.6
      9: 7.6, # Phoebe_sheareri 7.5 + 7.6
      10: 4.8, # Sassafras_tzumu 4.0 - 4.4 +4.8
      11: 4.7, # Ulmus_pumila 4.6
      12: 8.2  # Zelkova_schneideriana 4.8 -8.2







