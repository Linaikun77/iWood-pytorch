
use_ema: True 
ema:
  type: ModelEMA
  decay: 0.999
  warmups: 1000


find_unused_parameters: True 

epoches: 30
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params: 
    - 
      params: 'backbone'
      lr: 0.00005
    -
      params: '^(?=.*encoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.001
    -
      params: '^(?=.*decoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.005

  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.0005


lr_scheduler:
  type: MultiStepLR
  milestones: [800]
  gamma: 0.1







